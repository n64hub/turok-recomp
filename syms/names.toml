# Names worked out for Turok: Dinosaur Hunter's functions, kept for good (mods and hooks use them).
# lib/turok-engine/tools/gen_syms.py takes each as a function start and names it, over n64sym's names and
# func_<address>. t1_ marks the game's own.
#
# The boot code (ROM 0x1000, run at 0x80000400): the entry point, the ROM read off the cartridge bus it loads the packed
# main program with (replaced by a native, src/game/boot.cpp), its loader, and the RNC unpackers.

[[func]]
vram = 0x80000400
name = "t1_entrypoint"

[[func]]
vram = 0x80000450
name = "t1_boot_rom_read"

[[func]]
vram = 0x800004C4
name = "t1_boot_load_main"

[[func]]
vram = 0x80000640
name = "t1_rnc1_unpack"

[[func]]
vram = 0x80000BD0
name = "t1_rnc2_unpack"

# The method 2 unpacker's body, which its wrapper above calls; it starts in the delay slot of the wrapper's jr $ra.
# Hand-written, it jumps to labels across itself, which are no function starts.
[[func]]
vram = 0x80000C78
name = "t1_rnc2_unpack_body"

[[label]]
vram = 0x80000C7C

[[label]]
vram = 0x80001220

# The main program's entry and its first thread's setup.

[[func]]
vram = 0x80001300
name = "t1_main"

[[func]]
vram = 0x80001CD4
name = "t1_boot_main"

# libultra the runtime replaces by name, which n64sym's signatures don't match in this older libultra: found by what
