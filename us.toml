# N64Recomp's configuration for Turok: Dinosaur Hunter (USA 1.0), SHA-1 40fb0250c095740031278fb1f82b9937a3895e01: it
# reads the game's code by the symbols in syms/ (lib/turok-engine/tools/gen_syms.py and syms/layout.toml) out of
# roms/turok1.us.recomp.z64, the ROM with its packed main program unpacked after it (tools/unpack_main.py), and writes
# RecompiledFuncs/ (tools/recompile.sh). Unlike the later games of the engine, all of its code runs in kseg0.
[input]
# The header's entry point: the boot code the IPL3 copies there, which reads the packed main program from the ROM,
# unpacks it to 0x80001300 and jumps to it.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/turok1.us.syms.toml"
rom_file_path = "roms/turok1.us.recomp.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Development hardware's cop0 register 7 (syms/names.toml); no call reaches it. Stubbed (an empty body).
stubs = [
    "t1_DevCop0",
]
# Natives in their place.
ignored = [
    # The boot code's ROM read, which polls the PI and loads words straight off the cartridge bus (src/game/boot.cpp).
    "t1_boot_rom_read",
    # osAiGetStatus, the audio thread's pace (lib/turok-engine/src/audio.cpp).
    "turok_ai_get_status",
]

# The entry point sets $sp and jumps to the loader with jr $t2, which N64Recomp would take for a switch: a j to the same
# address, a tail call. N64Recomp names the entry point recomp_entrypoint.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x8000040C
value = 0x08000131

# osClockRate (0x800EE420): libultra's osInitialize sets it, but the runtime's, which runs in its place, doesn't
# (lib/turok-engine/src/pi_dma.cpp). Set right after the game's call.
[[patches.hook]]
func = "t1_boot_main"
before_vram = 0x80001CE4
text = "    { void turok_set_clock_rate(uint8_t*, uint32_t); turok_set_clock_rate(rdram, 0x800EE420); }"

# The RCP scheduler's watchdog (the retrace handler, from 0x8002BBFC): when 160 retraces pass with no graphics task
# done, it stores to address 0 on purpose, the console's crash for a hung RCP. Here a frame that long is a first-time
# shader build or a slow GPU (Mesa's software Vulkan with an empty shader cache took that long at boot), not a hang:
# the store is a nop, and the game waits for the frame.
[[patches.instruction]]
func = "func_8002BBFC"
vram = 0x8002BDD0
value = 0x00000000

# Widescreen (lib/turok-engine/src/widescreen.cpp, src/game/widescreen.cpp). The frame (func_800023EC, from the main
# loop's func_80007E44) draws through the display list head in its graphics struct ($a0, the head at +0x1F810); the
# main loop is done with the display list where it ends it, at 0x80007F48. The game's play (func_800036B0, the
# graphics struct in $s1) draws the world, and from 0x800037F4 its HUD, the status bar's health, ammo and keys
# (func_8007D544), to 0x80003828; then the messages (func_80083310), after the HUD's end: they are lines of letters
# centred on the screen, and the bottom quarter's automatic anchoring would put a low line's left letters at the
# window's left edge and its right ones at the right (the first level's "TO OPEN LEVEL PORTALS"), so they stay in the
# middle of the window as they are at 4:3.
[[patches.hook]]
func = "func_800023EC"
before_vram = 0x8000240C
text = "    { void t1_frame_begin(uint8_t*, uint32_t); t1_frame_begin(rdram, (uint32_t)ctx->r16); }"

[[patches.hook]]
func = "func_80007E44"
before_vram = 0x80007F48
text = "    { void turok_frame_end(uint8_t*); turok_frame_end(rdram); }"

[[patches.hook]]
func = "func_800036B0"
before_vram = 0x800037F4
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

[[patches.hook]]
func = "func_800036B0"
before_vram = 0x80003828
text = "    { void turok_hud_end(uint8_t*); turok_hud_end(rdram); }"

# The camera (func_80037E3C) has made its float view-projection matrix, at 0x801195F4, which the culling reads, and
# the display list's copy of it (func_800121E0): widened from here for the culling.
[[patches.hook]]
func = "func_80037E3C"
before_vram = 0x800385E0
text = "    { void turok_widen_culling(uint8_t*, uint32_t); turok_widen_culling(rdram, 0x801195F4); }"

# The camera's view pyramid (5 points from sp+0xC0: the eye, then the far corners from the field of view), made in its
# own space and moved into the world (func_800156A4) a point a turn of the loop at 0x80038A0C, its side planes
# (func_80084740) and bounding box (func_80018A18) taken from it for the level's culling: widened, as the matrix is,
# on the loop's first turn (a1 still at sp+0xC0), before any point is moved. Without it a 21:9 picture's cliff walls
# stopped on a vertical line short of the window's sides, the fog colour past them.
[[patches.hook]]
func = "func_80037E3C"
before_vram = 0x80038A0C
text = "    if ((uint32_t)ctx->r5 == (uint32_t)ctx->r29 + 0xC0) { void turok_widen_frustum(uint8_t*, uint32_t, uint32_t); turok_widen_frustum(rdram, (uint32_t)ctx->r29 + 0xC0, 5); }"

# The menus go the way the keys and sticks are pushed. The game looks down with its stick pushed up, as a plane's stick,
# so src/game/config.cpp binds the up arrow and the right stick pushed up to the stick pushed down, and src/main/main.cpp
# adds the mouse the same way: up looks up. The menus' up (func_80006770) and down (func_8000658C), after the D-pad and
# C buttons, ask the stick through the control bindings the game looks with: func_80051914 for the stick pushed up and
# func_80051944 for it pushed down. So up moved their cursor down; here each asks the other one, which the look leaves
# as it was.
[[patches.instruction]]
func = "func_80006770"
vram = 0x80006880
value = 0x0C014651
[[patches.instruction]]
func = "func_8000658C"
vram = 0x8000669C
value = 0x0C014645

# Mouse look (lib/turok-engine/src/mouse_look.cpp): the mouse turns the view itself instead of being added to the stick.
# The player's control on foot (func_80052B1C, its control struct in s0, the player's object saved at sp+0xB4) has just
# made the target its pitch (the struct's +0x70, radians, growing upwards) moves towards, at +0x68, from the stick, so
# that the look springs back level when the stick is let go, and is about to move the pitch: the engine adds the mouse's
# movement to the yaw (the object's +0x64, radians, growing to the right) and the pitch and holds the target, within
# the stick's own limits (-1.3614 and pi/2). The pitch is read into f12 before here, so it's read again.
[[patches.hook]]
func = "func_80052B1C"
before_vram = 0x80053688
text = "    { void turok_mouse_look(uint8_t*, uint32_t, float, uint32_t, float, gpr*, float, float); gpr target = MEM_W(0x68, ctx->r16); turok_mouse_look(rdram, (uint32_t)MEM_W(0xB4, ctx->r29) + 0x64, 1.0f, (uint32_t)ctx->r16 + 0x70, 1.0f, &target, -1.3613568f, 1.5707964f); MEM_W(0x68, ctx->r16) = (int32_t)target; ctx->f12.u32l = MEM_W(0x70, ctx->r16); }"
